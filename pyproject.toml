[project]
name = "sentinelops-ai"
version = "0.1.0"
description = "Evidence-driven incident investigation and controlled remediation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.8,<3",
  "sqlalchemy[asyncio]>=2.0.38,<3", "aiosqlite>=0.21,<1", "alembic>=1.15,<2",
  "httpx>=0.28,<1", "numpy>=2.2,<3",
]

[project.optional-dependencies]
gcp = ["google-cloud-logging>=3.12,<4", "google-cloud-monitoring>=2.27,<3", "google-cloud-run>=0.10,<1", "google-cloud-pubsub>=2.29,<3", "google-cloud-bigquery>=3.30,<4", "google-cloud-secret-manager>=2.23,<3", "google-genai>=1.10,<2", "google-adk>=1.0,<2"]

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-PyYAML>=6,<7", "playwright>=1.51,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sentinelops"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["cloud: requires real GCP credentials and explicit opt-in"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["sentinelops"]
ignore_missing_imports = true

