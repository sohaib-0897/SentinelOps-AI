name: Deploy configured GCP runtimes
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: gcp-deployment
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/codex/build-sentinelops'
    runs-on: ubuntu-latest
    environment: gcp-production
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      ENVIRONMENT: production
    steps:
      - uses: actions/checkout@v4
      - name: Require explicit cloud configuration
        run: |
          [[ "$PROJECT_ID" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]]
          [[ "$REGION" =~ ^[a-z]+-[a-z]+[0-9]$ ]]
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Build and publish immutable images
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          repository="$REGION-docker.pkg.dev/$PROJECT_ID/sentinelops-$ENVIRONMENT"
          docker build --platform=linux/amd64 -t "$repository/api:$GITHUB_SHA" .
          docker build --platform=linux/amd64 -t "$repository/dashboard:$GITHUB_SHA" apps/dashboard
          docker push "$repository/api:$GITHUB_SHA"
          docker push "$repository/dashboard:$GITHUB_SHA"
          api_digest=$(gcloud artifacts docker images describe "$repository/api:$GITHUB_SHA" --project="$PROJECT_ID" --format='value(image_summary.digest)')
          dashboard_digest=$(gcloud artifacts docker images describe "$repository/dashboard:$GITHUB_SHA" --project="$PROJECT_ID" --format='value(image_summary.digest)')
          [[ "$api_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$dashboard_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "API_IMAGE=$repository/api@$api_digest" >> "$GITHUB_ENV"
          echo "DASHBOARD_IMAGE=$repository/dashboard@$dashboard_digest" >> "$GITHUB_ENV"
      - name: Update existing services and jobs
        run: |
          gcloud run services update "sentinelops-$ENVIRONMENT-api" --project="$PROJECT_ID" --region="$REGION" --image="$API_IMAGE"
          gcloud run services update "sentinelops-$ENVIRONMENT-dashboard" --project="$PROJECT_ID" --region="$REGION" --image="$DASHBOARD_IMAGE"
          for worker in telemetry analytics; do
            gcloud run jobs update "sentinelops-$ENVIRONMENT-$worker" --project="$PROJECT_ID" --region="$REGION" --image="$API_IMAGE"
          done
          echo "Reconcile these image digests into Terraform variables before the next infrastructure plan." >> "$GITHUB_STEP_SUMMARY"
