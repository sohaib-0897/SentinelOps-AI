name: CI
on:
  pull_request:
  push:
    branches: [main, codex/build-sentinelops]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.21'
          python-version: '3.12'
      - run: uv sync --frozen --extra gcp
      - run: uv run --extra gcp pytest -q
      - run: uv run --extra gcp ruff check sentinelops tests scripts
      - run: uv run --extra gcp mypy sentinelops
      - run: uv run python -m sentinelops.evaluation.run
      - run: git diff --exit-code -- evals/results/latest.json
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.5'
      - run: terraform -chdir=infra/terraform fmt -check -recursive
      - run: terraform -chdir=infra/terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=infra/terraform validate
      - run: terraform -chdir=infra/terraform test
      - run: docker compose config --quiet
  containers-and-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.21'
          python-version: '3.12'
      - run: uv sync --frozen
      - run: uv run playwright install --with-deps chromium
      - run: docker compose build
      - run: docker compose up -d --wait
      - run: uv run python scripts/browser_qa.py
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: |
            docs/verification/local-e2e.json
            docs/screenshots/
      - if: always()
        run: docker compose down
